# offsets.cfg - ALL values are per-CS2-build. Regenerate after every game
# update with a schema dumper (e.g. a2x/cs2-dumper) + tools/cs2dumper_to_cfg.py.
# The numbers below are an EXAMPLE SNAPSHOT layout for development only;
# treat them as placeholders until regenerated against the live client.dll.

# ---- client.dll globals ----
client.dwEntityList = 0x0
client.dwLocalPlayerController = 0x0
client.dwLocalPlayerPawn = 0x0          # optional fast path, 0 = resolve via controller

# ---- schema: controller / pawn ----
schema.CBasePlayerController.m_hPawn = 0x0
schema.CBasePlayerController.m_steamID = 0x0
schema.C_CSPlayerPawnBase.m_pWeaponServices = 0x0
schema.C_CSPlayerPawn.m_EconGloves = 0x0

# ---- schema: weapon services ----
schema.CPlayer_WeaponServices.m_hMyWeapons = 0x0
schema.CPlayer_WeaponServices.m_hActiveWeapon = 0x0

# ---- schema: econ item view ----
schema.C_EconEntity.m_AttributeManager = 0x0
schema.C_AttributeContainer.m_Item = 0x0
schema.C_EconItemView.m_iItemDefinitionIndex = 0x0
schema.C_EconItemView.m_iEntityQuality = 0x0
schema.C_EconItemView.m_iItemID = 0x0
schema.C_EconItemView.m_iAccountID = 0x0
schema.C_EconItemView.m_bInitialized = 0x0
schema.C_EconItemView.m_AttributeList = 0x0
schema.CAttributeList.m_Attributes = 0x0

# ---- schema: CEconItemAttribute element layout ----
schema.CEconItemAttribute.m_iAttributeDefinitionIndex = 0x0
schema.CEconItemAttribute.m_nValue = 0x4
schema.CEconItemAttribute.m_flValue = 0x8
layout.attr.stride = 0x18

# ---- C_NetworkUtlVectorBase layout (relative to vector base) ----
layout.utlvector.count_rel = 0x0
layout.utlvector.data_rel = 0x8

# ---- entity handle -> pointer resolution ----
# chunk  = *(entityList + chunk_base + 8 * ((handle & 0x7FFF) >> chunk_shift))
# entity = *(chunk + identity_stride * ((handle & 0x7FFF) & index_mask))
layout.entity.chunk_base = 0x10
layout.entity.chunk_shift = 9
layout.entity.index_mask = 0x1FF
layout.entity.identity_stride = 0x78

# skins.cfg - what to apply. Keys:
#   weapon.<name|defindex>.paintkit  = <name|id>   paint kit (attribute 6)
#   weapon.<name|defindex>.wear      = <float>     0.00 factory new .. 1.00 battle-scarred (attribute 8)
#   weapon.<name|defindex>.seed      = <int>       pattern seed, e.g. 661 = AK CH "blue gem" (attribute 7)
#   weapon.<name|defindex>.stattrak  = <int>       kill counter value (attributes 80/81, quality 9)
#   knife.defindex = <name|id>                     knife model swap (e.g. karambit, 507)
#   knife.paintkit / knife.wear / knife.seed / knife.stattrak
#   glove.paintkit / glove.wear / glove.seed       gloves (no defindex swap in this PoC)
#
# Names resolve through src/paintkits.hpp; raw numbers always work.

# AK-47 | Asiimov, minimal wear, StatTrak
weapon.ak47.paintkit = ak_asiimov
weapon.ak47.wear = 0.07
weapon.ak47.stattrak = 1337

# AK-47 | Case Hardened pattern 661 ("blue gem") alternative:
# weapon.ak47.paintkit = case_hardened
# weapon.ak47.seed = 661
# weapon.ak47.wear = 0.15

# AWP | Dragon Lore, factory new
weapon.awp.paintkit = awp_dragon_lore
weapon.awp.wear = 0.001

# M4A4 | Howl
weapon.m4a4.paintkit = m4a4_howl
weapon.m4a4.wear = 0.03

# Desert Eagle | Blaze
weapon.deagle.paintkit = deagle_blaze
weapon.deagle.wear = 0.008

# Karambit | Doppler Sapphire
knife.defindex = weapon_knife_karambit
knife.paintkit = doppler_sapphire
knife.wear = 0.0001
knife.seed = 0
